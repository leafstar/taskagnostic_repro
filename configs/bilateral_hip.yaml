seed: 42

data:
  root: ${CAMARGO_DATA_ROOT}/raw
  cache_dir: ${CAMARGO_DATA_ROOT}/processed
  sample_rate_hz: 200
  max_subjects: null
  participant_glob: "*"
  trial_glob: "**/ik/*.mat"
  exclude_path_patterns:
    - "static"
  include_left_mirror: false
  task_label_from_path: true
  validation:
    mode: random
    val_fraction: 0.2
    lopo_subject: null

  feature_patterns:
    - "hip_flexion_[rl]$|knee_angle_[rl]$|ankle_angle_[rl]$"
    - "hip_flexion_[rl]_vel$|knee_angle_[rl]_vel$|ankle_angle_[rl]_vel$"
    - "Accel|Gyro"
  target_patterns:
    hip_r: "hip_flexion_r_moment"
    hip_l: "hip_flexion_l_moment"

  mirror_feature_sign_patterns: []
  mirror_target_sign_patterns: []

window:
  length: 250
  stride: 1
  label_at: last

model:
  filters: 64
  kernel_size: 5
  num_blocks: 5
  dropout: 0.2
  output_dim: 2
  use_weight_norm: true

train:
  epochs: 100
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.0
  num_workers: 2
  device: auto
  log_dir: runs/bilateral_hip
  checkpoint_dir: checkpoints/bilateral_hip
  grad_clip_norm: 1.0
  save_every: 10
  limit_train_windows: null
  limit_val_windows: null

evaluate:
  checkpoint: checkpoints/bilateral_hip/best.pt
  batch_size: 256
  split: val
  output_csv: reports/bilateral_hip_eval_metrics.csv
